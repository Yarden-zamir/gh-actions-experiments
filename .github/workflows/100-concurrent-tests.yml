name: 100 concurrent tests in one job

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run 100 concurrent tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run tests
        run: node --test test/concurrency.test.mjs
